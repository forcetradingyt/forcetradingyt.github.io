<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Force Trading YT — Learn to Trade</title>
    <meta
      name="description"
      content="Interactive 3D showcase for Force Trading YT — price action, risk management and intraday trading, explained candle by candle."
    />
    <!--
  Interactive 3D book showcase for Force Trading YT. Single file, no build step.

  Notes for editing:
  - Book data + procedural cover painters live in the BOOKS array below.
  - Each book's coverURL points at a real image in covers/ (same-origin, so it
    always loads). Drop a replacement image over covers/<book>.png or point
    coverURL at any external URL — the code attempts a CORS texture load,
    falling back to the painted cover if the host does not send
    Access-Control-Allow-Origin (Amazon image CDNs do not).
  - All geometry, textures, lighting and the environment map are procedural.
  - Forest theme: the backdrop canvas paints a dark tropical forest (canopy,
    trunks, hanging vines, golden sunbeams, wet reflective ground) — purely
    visual, no text baked in. The UI accent is dark emerald / leaf green.
  - All books are visible from the first frame; each book's detail view lists
    the other books as clickable recommendations (in-place 3D swap).
  - The logo (open book + leaf-green path mark) and both "Join Premium" buttons
    link to https://forcetradingyt.github.io/ (new tab) — the URL is never shown
    as visible text. The "Watch on YouTube" pill is still a plain button — drop
    your YouTube channel URL into it in the .actions block to wire it up.
-->
    <style>
      :root {
        /* forest palette: dark greens, leaf green accent, warm beige text */
        --navy: #141a32;
        --ink: #0c1428;
        --pink: #9ecf9f; /* leaf-green accent (kept name for existing usages) */
        --green-bright: #b7e0b0;
        --green-deep: #2f8f5b; /* emerald for primary buttons */
        --green-deep2: #1c6b43;
        --cream: #f6efe0; /* warm beige */
        --lav: #e9e4d4; /* warm beige text (kept name for existing usages) */
        --peri: #2e9e6b; /* emerald accent (kept name for existing usages) */
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(
            60% 50% at 18% 8%,
            rgba(158, 207, 159, 0.07) 0%,
            transparent 55%
          ),
          radial-gradient(
            120% 100% at 50% 0%,
            #0d1a0f 0%,
            #08120a 55%,
            #040803 100%
          );
        color: var(--lav);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
          Arial, sans-serif;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: 0;
      }
      button:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 3px;
      }

      /* ---------- hero word ---------- */
      .hero-word {
        position: fixed;
        top: 18vh;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1;
        user-select: none;
        pointer-events: none;
        transition:
          opacity 0.55s ease,
          transform 0.55s ease;
      }
      .hero-word span {
        display: block;
        white-space: nowrap;
        font-size: min(22.5vw, 45vh);
        font-weight: 800;
        letter-spacing: -0.015em;
        line-height: 0.85;
        color: var(--pink);
        text-shadow:
          0 0 34px rgba(158, 207, 159, 0.4),
          0 0 90px rgba(158, 207, 159, 0.22);
        animation: heroIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
      }
      @keyframes heroIn {
        from {
          opacity: 0;
          transform: translateY(60px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      body.detail-open .hero-word,
      body.transit .hero-word {
        opacity: 0;
        transform: translateX(-50%) translateY(-44px);
      }

      /* ---------- hero tagline: a quiet bottom note, clear of the books ---------- */
      .hero-tag {
        position: fixed;
        left: 50%;
        bottom: 4vh;
        transform: translateX(-50%);
        z-index: 1;
        user-select: none;
        pointer-events: none;
        color: var(--lav);
        font-size: clamp(12px, 1.3vw, 16px);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 600;
        white-space: nowrap;
        opacity: 0;
        animation: tagIn 1s cubic-bezier(0.22, 1, 0.36, 1) 0.9s both;
        transition:
          opacity 0.55s ease,
          transform 0.55s ease;
      }
      @keyframes tagIn {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }
      body.detail-open .hero-tag,
      body.transit .hero-tag {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }

      /* ---------- space backdrop canvas ---------- */
      #bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: block;
        pointer-events: none;
      }

      /* ---------- canvas ---------- */
      #gl {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: block;
        touch-action: none;
      }

      /* ---------- nav ---------- */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 40;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 26px 42px;
        pointer-events: none;
      }
      nav > * {
        pointer-events: auto;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--pink);
        font-weight: 800;
        font-size: clamp(19px, 2.1vw, 27px);
        letter-spacing: -0.01em;
        text-decoration: none;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .logo:hover {
        transform: scale(1.03);
      }
      .logo:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 3px;
      }
      .logo-mark {
        width: 30px;
        height: 30px;
        flex: none;
        filter: drop-shadow(0 0 10px rgba(158, 207, 159, 0.4));
      }
      .nav-r {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .menu-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--cream);
        color: var(--navy);
        font-size: 20px;
        font-weight: 800;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .cta {
        height: 48px;
        padding: 0 26px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        background: linear-gradient(180deg, var(--green-deep), var(--green-deep2));
        color: #eaf6ea;
        font-weight: 700;
        font-size: 16px;
        text-decoration: none;
        box-shadow: 0 10px 30px rgba(47, 143, 91, 0.35);
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .menu-btn:hover,
      .cta:hover {
        transform: scale(1.05);
      }
      .cta:focus-visible,
      .pill:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 3px;
      }
      .nav-back {
        height: 48px;
        padding: 0 22px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        background: transparent;
        color: var(--lav);
        border: 1.5px solid rgba(233, 228, 212, 0.35);
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        transition:
          transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
          border-color 0.25s ease,
          color 0.25s ease;
      }
      .nav-back:hover {
        transform: scale(1.05);
        border-color: rgba(158, 207, 159, 0.85);
        color: #fff;
      }
      .nav-back:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 3px;
      }
      .nav-back svg {
        width: 17px;
        height: 17px;
        flex: none;
      }

      /* ---------- open slip: a torn scrap of page that trails the cursor ----------
         clip-path gives every edge a deckled tear; drop-shadow (not box-shadow)
         is used so the shadow follows the torn silhouette instead of a rectangle.
         Never interactive: the click is handled by the book underneath. */
      #openBtn {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 30;
        padding: 16px 38px 18px;
        border: 0;
        border-radius: 0;
        background:
          repeating-linear-gradient(
            92deg,
            rgba(90, 74, 40, 0.03) 0 2px,
            transparent 2px 6px
          ),
          radial-gradient(
            125% 150% at 28% 0%,
            #fffdf7 0%,
            #f8f2e3 58%,
            #ede4cf 100%
          );
        color: var(--navy);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        clip-path: polygon(
          0% 0.9%,
          8.3% 0.8%,
          16.7% 6.3%,
          25% 3.8%,
          33.3% 5.5%,
          41.7% 2.7%,
          50% 5.2%,
          58.3% 0.4%,
          66.7% 5.9%,
          75% 6.5%,
          83.3% 1%,
          91.7% 6.4%,
          100% 0.7%,
          97.7% 20%,
          97% 40%,
          99.6% 60%,
          98.7% 80%,
          100% 96.5%,
          91.7% 99.8%,
          83.3% 95.6%,
          75% 94.9%,
          66.7% 96.6%,
          58.3% 93.5%,
          50% 97.9%,
          41.7% 99.5%,
          33.3% 93.2%,
          25% 93.6%,
          16.7% 93.2%,
          8.3% 93.1%,
          0% 93.5%,
          0.2% 80%,
          1.1% 60%,
          3.9% 40%,
          3.8% 20%
        );
        filter: drop-shadow(0 2px 1px rgba(0, 0, 0, 0.16))
          drop-shadow(0 14px 26px rgba(0, 0, 0, 0.4));
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) rotate(-1.6deg) scale(0.94);
        transition:
          opacity 0.24s ease,
          transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: transform, opacity, left, top;
      }
      #openBtn.on {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(-1.6deg) scale(1);
      }

      /* ---------- close button ---------- */
      #closeBtn {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 40;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: transparent;
        color: var(--cream);
        border: 1.5px solid rgba(253, 251, 244, 0.4);
        font-size: 17px;
        line-height: 1;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.4s ease 0.15s,
          border-color 0.25s ease;
      }
      #closeBtn:hover {
        border-color: rgba(253, 251, 244, 0.9);
      }
      body.detail-open #closeBtn {
        opacity: 1;
        pointer-events: auto;
      }

      /* ---------- detail panel ---------- */
      .dp {
        position: fixed;
        right: 7vw;
        top: 50%;
        transform: translateY(-50%);
        width: min(560px, 42vw);
        max-height: calc(100vh - 48px);
        overflow-y: auto;
        z-index: 15;
        pointer-events: none;
        visibility: hidden;
        transition: visibility 0s 0.5s;
      }
      .dp::-webkit-scrollbar {
        width: 6px;
      }
      .dp::-webkit-scrollbar-thumb {
        background: rgba(158, 207, 159, 0.3);
        border-radius: 3px;
      }
      body.detail-open .dp {
        visibility: visible;
        transition: visibility 0s 0s;
      }
      .dp > * {
        opacity: 0;
        transform: translateY(28px);
        transition:
          opacity 0.28s ease,
          transform 0.28s ease;
      }
      body.detail-open .dp > * {
        opacity: 1;
        transform: none;
        transition:
          opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      }
      body.detail-open .dp > *:nth-child(1) {
        transition-delay: 0.05s;
      }
      body.detail-open .dp > *:nth-child(2) {
        transition-delay: 0.13s;
      }
      body.detail-open .dp > *:nth-child(3) {
        transition-delay: 0.21s;
      }
      body.detail-open .dp > *:nth-child(4) {
        transition-delay: 0.27s;
      }
      body.detail-open .dp > *:nth-child(5) {
        transition-delay: 0.33s;
      }
      body.detail-open .dp > *:nth-child(6) {
        transition-delay: 0.39s;
      }

      .dp-cover {
        width: 188px;
        aspect-ratio: 2 / 3;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 26px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(158, 207, 159, 0.22);
        box-shadow:
          0 34px 70px rgba(0, 0, 0, 0.5),
          0 8px 18px rgba(0, 0, 0, 0.35),
          0 0 34px rgba(158, 207, 159, 0.12);
      }
      .dp-cover img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }
      body.detail-open .dp .dp-cover {
        transform: rotate(-2.5deg);
      }

      .dp h1 {
        margin: 0;
        color: var(--pink);
        font-size: clamp(30px, 3.2vw, 46px);
        font-weight: 800;
        line-height: 1.06;
        letter-spacing: -0.015em;
        text-shadow: 0 0 30px rgba(158, 207, 159, 0.35);
      }
      .dp p {
        margin: 26px 0 0;
        color: var(--lav);
        font-size: clamp(16px, 1.25vw, 19px);
        line-height: 1.65;
        font-weight: 400;
        max-width: 54ch;
      }
      .meta {
        margin-top: 34px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .stars {
        display: flex;
        gap: 5px;
      }
      .stars svg {
        width: 25px;
        height: 25px;
        fill: var(--pink);
      }
      .stars svg.dim {
        opacity: 0.25;
      }
      .sep {
        width: 1px;
        height: 24px;
        background: rgba(158, 207, 159, 0.32);
      }
      .src,
      .year {
        color: #c9bfa4;
        font-style: italic;
        font-size: 19px;
      }
      .year {
        margin-left: auto;
      }
      .rule {
        margin-top: 26px;
        border-top: 1px solid rgba(158, 207, 159, 0.22);
      }
      .actions {
        margin-top: 32px;
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        background: linear-gradient(
          180deg,
          rgba(13, 28, 19, 0.92),
          rgba(8, 18, 12, 0.92)
        );
        border: 1px solid rgba(158, 207, 159, 0.3);
        border-radius: 28px;
        padding: 10px;
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.5),
          0 0 40px rgba(158, 207, 159, 0.1);
        pointer-events: auto;
      }
      .pill {
        height: 54px;
        padding: 0 26px;
        border-radius: 999px;
        font-size: 16.5px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        transition:
          transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
          filter 0.2s;
      }
      .pill:hover {
        transform: scale(1.04);
        filter: brightness(1.05);
      }
      .pill.lang {
        background: var(--cream);
        color: var(--navy);
      }
      .pill.buy {
        background: var(--peri);
        color: #0c1428;
        font-weight: 700;
      }
      .pill.gold {
        background: linear-gradient(180deg, var(--green-deep), var(--green-deep2));
        color: #eaf6ea;
        font-weight: 700;
        box-shadow: 0 10px 30px rgba(47, 143, 91, 0.3);
      }
      .pill.iconb {
        width: 54px;
        padding: 0;
        justify-content: center;
        background: #12261a;
        color: var(--lav);
      }
      .pill svg {
        width: 20px;
        height: 20px;
      }

      /* ---------- book recommendations inside the detail panel ---------- */
      .recs {
        margin-top: 26px;
        pointer-events: auto;
      }
      .recs-head {
        margin-bottom: 12px;
        color: rgba(233, 228, 212, 0.62);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .recs-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .rec {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px 8px 8px;
        pointer-events: auto;
        border-radius: 14px;
        background: rgba(13, 28, 19, 0.55);
        border: 1px solid rgba(158, 207, 159, 0.22);
        color: var(--lav);
        text-align: left;
        cursor: pointer;
        transition:
          transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
          border-color 0.2s ease,
          background 0.2s ease;
      }
      .rec:hover {
        transform: translateY(-2px);
        border-color: rgba(158, 207, 159, 0.6);
        background: rgba(13, 28, 19, 0.85);
      }
      .rec:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 2px;
      }
      .rec-cover {
        width: 44px;
        aspect-ratio: 2 / 3;
        border-radius: 5px;
        object-fit: cover;
        flex: none;
      }
      .rec-cover-fb {
        background: linear-gradient(160deg, #1c3a26, #0d2014);
      }
      .rec-title {
        font-size: 14.5px;
        font-weight: 600;
        line-height: 1.3;
      }


      /* ---------- portrait / small screens ---------- */
      @media (max-aspect-ratio: 17/20), (max-width: 760px) {
        nav {
          padding: 18px 20px;
        }
        .nav-back {
          width: 48px;
          padding: 0;
          justify-content: center;
        }
        .nav-back span {
          display: none;
        }
        .hero-word {
          top: 7vh;
        }
        .hero-word span {
          font-size: 34vw;
        }
        .dp-cover {
          width: 132px;
          margin-bottom: 16px;
        }
        .dp {
          right: auto;
          left: 50%;
          top: auto;
          bottom: 3.5vh;
          transform: translateX(-50%);
          width: min(560px, 92vw);
        }
      .nav-back span {
        display: inline;
      }
      .dp h1 {
        font-size: clamp(25px, 6.6vw, 36px);
      }
        .dp p {
          font-size: 15px;
          margin-top: 16px;
          display: -webkit-box;
          -webkit-line-clamp: 4;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }
        .meta {
          margin-top: 18px;
        }
        .rule {
          margin-top: 16px;
        }
        .actions {
          margin-top: 18px;
          flex-wrap: wrap;
          border-radius: 28px;
        }
        .pill {
          height: 48px;
          padding: 0 20px;
          font-size: 15px;
        }
        #closeBtn {
          top: 18px;
          left: auto;
          right: 18px;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01s !important;
          transition-duration: 0.01s !important;
        }
      }

      .webgl-fail {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px;
        color: var(--lav);
        font-size: 18px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="hero-word"><span>FORCE</span></div>
    <div class="hero-tag" aria-hidden="true">Trade with structure, not noise.</div>

    <canvas id="bg" aria-hidden="true"></canvas>
    <canvas id="gl"></canvas>

    <nav>
      <a
        class="logo"
        href="https://forcetradingyt.github.io/"
        target="_blank"
        rel="noopener"
        aria-label="Force Trading YT"
      >
        <svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path
            d="M16 22.6c-3.2-2.1-6.6-2.6-11-1.8V8.4c4.4-.8 7.8-.3 11 1.8v12.4Z"
            fill="#f6efe0"
          />
          <path
            d="M16 22.6c3.2-2.1 6.6-2.6 11-1.8V8.4c-4.4-.8-7.8-.3-11 1.8v12.4Z"
            fill="#e6dcc2"
          />
          <path d="M16 10.2v12.4" stroke="#9ecf9f" stroke-width="1.1" />
          <path
            d="M6.6 11.4c2.9-.4 5.3.1 7.2 1.8"
            stroke="#c9b98f"
            stroke-width="0.9"
            stroke-linecap="round"
          />
          <path
            d="M25.4 11.4c-2.9-.4-5.3.1-7.2 1.8"
            stroke="#c9b98f"
            stroke-width="0.9"
            stroke-linecap="round"
          />
          <path
            d="M16 9.4C16.6 6.6 18.9 5.3 21.7 4"
            stroke="#9ecf9f"
            stroke-width="1.7"
            stroke-linecap="round"
          />
          <path
            d="M23.6 0.4C23.9 1.4 24.4 1.9 25.4 2.2C24.4 2.5 23.9 3 23.6 4C23.3 3 22.8 2.5 21.8 2.2C22.8 1.9 23.3 1.4 23.6 0.4Z"
            fill="#9ecf9f"
          />
        </svg>
        <span>Force Trading YT</span>
      </a>
      <div class="nav-r">
        <a class="nav-back" href="index.html" aria-label="Back to the scanner">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 17l6-6 4 4 8-8" />
            <path d="M15 7h6v6" />
          </svg>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      /* =========================================================================
   0. Small utilities
   ========================================================================= */
      const RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

      class Spring {
        constructor(v, k, d) {
          this.v = v;
          this.t = v;
          this.vel = 0;
          this.k = k || 120;
          this.d = d || 14;
        }
        set(v) {
          this.v = v;
          this.t = v;
          this.vel = 0;
          return this;
        }
        update(dt) {
          const a = this.k * (this.t - this.v) - this.d * this.vel;
          this.vel += a * dt;
          this.v += this.vel * dt;
          return this.v;
        }
      }

      function mkCanvas(w, h) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        return c;
      }

      function drawSpaced(x, text, cx, y, ls) {
        const prev = x.textAlign;
        x.textAlign = "left";
        const chars = [...text];
        let tot = 0;
        const ws = chars.map((ch) => {
          const w = x.measureText(ch).width;
          tot += w;
          return w;
        });
        tot += ls * (chars.length - 1);
        let px = cx - tot / 2;
        chars.forEach((ch, i) => {
          x.fillText(ch, px, y);
          px += ws[i] + ls;
        });
        x.textAlign = prev;
      }

      function rr(x, px, py, w, h, r) {
        x.beginPath();
        x.moveTo(px + r, py);
        x.arcTo(px + w, py, px + w, py + h, r);
        x.arcTo(px + w, py + h, px, py + h, r);
        x.arcTo(px, py + h, px, py, r);
        x.arcTo(px, py, px + w, py, r);
        x.closePath();
      }

      /* =========================================================================
   0.5 Forest backdrop — dark canopy, trunks and vines, golden sunbeams,
       wet ground. Painted from the reference image's description; purely
       visual (no text, symbols or logos). Seeded, so it is stable on resize.
   ========================================================================= */
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const bgCanvas = document.getElementById("bg");
      const bgCtx = bgCanvas.getContext("2d");
      function paintForestBg() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        bgCanvas.width = Math.round(innerWidth * dpr);
        bgCanvas.height = Math.round(innerHeight * dpr);
        bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const w = innerWidth,
          h = innerHeight;
        const rnd = mulberry32(20260815);

        /* 1 — deep forest gradient (black-green shadows) */
        const sky = bgCtx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, "#0f1b10");
        sky.addColorStop(0.5, "#0a120b");
        sky.addColorStop(0.85, "#050a06");
        sky.addColorStop(1, "#020402");
        bgCtx.fillStyle = sky;
        bgCtx.fillRect(0, 0, w, h);

        /* 2 — warm light source glow, upper left */
        const glow = bgCtx.createRadialGradient(
          w * 0.16,
          h * 0.04,
          0,
          w * 0.16,
          h * 0.04,
          w * 0.55,
        );
        glow.addColorStop(0, "rgba(255,240,180,0.4)");
        glow.addColorStop(0.3, "rgba(255,214,120,0.13)");
        glow.addColorStop(1, "rgba(255,214,120,0)");
        bgCtx.fillStyle = glow;
        bgCtx.fillRect(0, 0, w, h);

        /* 3 — layered canopy silhouettes */
        const canopy = (y0, spread, color) => {
          bgCtx.fillStyle = color;
          for (let i = 0; i < 64; i++) {
            const cx = rnd() * w;
            const cy = y0 + (rnd() - 0.5) * spread;
            const r = spread * (0.3 + rnd() * 0.75);
            bgCtx.beginPath();
            bgCtx.arc(cx, cy, r, 0, 6.2832);
            bgCtx.fill();
          }
        };
        canopy(h * 0.06, h * 0.14, "rgba(10,22,12,0.92)");
        canopy(h * 0.18, h * 0.16, "rgba(5,12,6,0.95)");

        /* 4 — tree trunks framing the scene */
        const trunk = (tx, tw, top, bot) => {
          const grad = bgCtx.createLinearGradient(tx - tw, 0, tx + tw, 0);
          grad.addColorStop(0, "#0a130b");
          grad.addColorStop(0.5, "#040803");
          grad.addColorStop(1, "#060d07");
          bgCtx.fillStyle = grad;
          bgCtx.beginPath();
          bgCtx.moveTo(tx - tw, top);
          bgCtx.quadraticCurveTo(
            tx,
            top + (bot - top) * 0.05,
            tx - tw * 0.6,
            bot,
          );
          bgCtx.lineTo(tx + tw * 0.7, bot);
          bgCtx.quadraticCurveTo(
            tx,
            top + (bot - top) * 0.05,
            tx + tw,
            top,
          );
          bgCtx.closePath();
          bgCtx.fill();
        };
        trunk(w * 0.055, w * 0.03, h * 0.05, h);
        trunk(w * 0.31, w * 0.02, h * 0.03, h * 0.97);
        trunk(w * 0.79, w * 0.025, h * 0.04, h);
        trunk(w * 0.955, w * 0.032, h * 0.09, h);

        /* 5 — hanging roots and vines */
        bgCtx.strokeStyle = "rgba(9,17,10,0.9)";
        bgCtx.lineWidth = 1.6;
        for (let i = 0; i < 30; i++) {
          const vx = rnd() * w;
          const len = h * (0.12 + rnd() * 0.3);
          const sway = (rnd() - 0.5) * 44;
          bgCtx.beginPath();
          bgCtx.moveTo(vx, 0);
          bgCtx.quadraticCurveTo(vx + sway * 0.3, len * 0.5, vx + sway, len);
          bgCtx.stroke();
        }

        /* 6 — wet ground path with a golden reflection sheen */
        const ground = bgCtx.createLinearGradient(0, h * 0.78, 0, h);
        ground.addColorStop(0, "rgba(5,9,5,0)");
        ground.addColorStop(1, "rgba(2,3,2,0.92)");
        bgCtx.fillStyle = ground;
        bgCtx.fillRect(0, h * 0.78, w, h * 0.22);
        const sheen = bgCtx.createLinearGradient(0, h * 0.82, 0, h);
        sheen.addColorStop(0, "rgba(255,214,120,0.12)");
        sheen.addColorStop(0.55, "rgba(255,214,120,0.04)");
        sheen.addColorStop(1, "rgba(255,214,120,0)");
        bgCtx.fillStyle = sheen;
        bgCtx.beginPath();
        bgCtx.moveTo(0, h);
        bgCtx.quadraticCurveTo(w * 0.4, h * 0.74, w, h * 0.87);
        bgCtx.lineTo(w, h);
        bgCtx.closePath();
        bgCtx.fill();

        /* 7 — ferns and undergrowth in the lower left, catching the light */
        const fern = (fx, fy, s, col, lw) => {
          bgCtx.strokeStyle = col;
          bgCtx.lineWidth = lw;
          for (let k = 0; k < 8; k++) {
            const a = -2.5 + k * 0.38 + (rnd() - 0.5) * 0.1;
            const ex = fx + Math.cos(a) * s;
            const ey = fy + Math.sin(a) * s;
            bgCtx.beginPath();
            bgCtx.moveTo(fx, fy);
            bgCtx.quadraticCurveTo(
              fx + Math.cos(a) * s * 0.5,
              fy + Math.sin(a) * s * 0.5 - s * 0.3,
              ex,
              ey,
            );
            bgCtx.stroke();
          }
        };
        for (let i = 0; i < 26; i++) {
          fern(
            w * (0.02 + rnd() * 0.32),
            h * (0.8 + rnd() * 0.18),
            20 + rnd() * 34,
            "rgba(22,46,24,0.95)",
            1.7,
          );
        }
        for (let i = 0; i < 14; i++) {
          fern(
            w * (0.04 + rnd() * 0.22),
            h * (0.82 + rnd() * 0.16),
            14 + rnd() * 22,
            "rgba(126,152,66,0.5)",
            1.4,
          );
        }

        /* 8 — rain streaks hanging from the canopy */
        bgCtx.strokeStyle = "rgba(190,216,192,0.13)";
        bgCtx.lineWidth = 1;
        for (let i = 0; i < 110; i++) {
          const rx = rnd() * w;
          const ry = rnd() * h * 0.55;
          const rl = 8 + rnd() * 28;
          bgCtx.beginPath();
          bgCtx.moveTo(rx, ry);
          bgCtx.lineTo(rx - 2, ry + rl);
          bgCtx.stroke();
        }

        /* 9 — golden sunbeams slanting down-right, additive */
        bgCtx.globalCompositeOperation = "lighter";
        for (let i = 0; i < 16; i++) {
          const sx = w * (0.04 + rnd() * 0.26);
          const sy = -h * 0.02;
          const len = h * (0.65 + rnd() * 0.55);
          const ex = sx + len * (0.42 + rnd() * 0.3);
          const ey = sy + len;
          const bw = w * (0.012 + rnd() * 0.03);
          const grad = bgCtx.createLinearGradient(sx, sy, ex, ey);
          grad.addColorStop(0, "rgba(255,222,132,0.2)");
          grad.addColorStop(0.6, "rgba(255,198,98,0.07)");
          grad.addColorStop(1, "rgba(255,198,98,0)");
          bgCtx.strokeStyle = grad;
          bgCtx.lineWidth = bw;
          bgCtx.beginPath();
          bgCtx.moveTo(sx, sy);
          bgCtx.lineTo(ex, ey);
          bgCtx.stroke();
        }
        const core = bgCtx.createRadialGradient(
          w * 0.16,
          h * 0.03,
          0,
          w * 0.16,
          h * 0.03,
          w * 0.2,
        );
        core.addColorStop(0, "rgba(255,244,208,0.38)");
        core.addColorStop(1, "rgba(255,244,208,0)");
        bgCtx.fillStyle = core;
        bgCtx.fillRect(0, 0, w, h);
        bgCtx.globalCompositeOperation = "source-over";

        /* 10 — droplet ripples on the wet ground */
        bgCtx.strokeStyle = "rgba(255,220,150,0.13)";
        bgCtx.lineWidth = 1;
        for (let i = 0; i < 14; i++) {
          const rx = w * (0.08 + rnd() * 0.84);
          const ry = h * (0.87 + rnd() * 0.12);
          const rr = 3 + rnd() * 11;
          bgCtx.beginPath();
          bgCtx.arc(rx, ry, rr, 0, 6.2832);
          bgCtx.stroke();
        }
      }
      paintForestBg();
      window.addEventListener("resize", paintForestBg);

      /* =========================================================================
   1. Renderer, scene, camera, lights
   ========================================================================= */
      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({
          canvas: document.getElementById("gl"),
          antialias: true,
          alpha: true,
        });
      } catch (e) {
        document.body.insertAdjacentHTML(
          "beforeend",
          '<div class="webgl-fail">This experience needs WebGL, which your browser blocked or does not support.</div>',
        );
        throw e;
      }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      /* held just under 1 so cover art keeps its printed saturation instead of
         being rolled off toward white by the filmic curve */
      renderer.toneMappingExposure = 0.92;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      const ANISO = renderer.capabilities.getMaxAnisotropy();

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        26,
        window.innerWidth / window.innerHeight,
        0.1,
        100,
      );
      camera.position.set(0, 0.1, 9.6);

      /* studio environment: painted equirect, prefiltered */
      function envBlob(x, cx, cy, r, rgb, a) {
        const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, "rgba(" + rgb + "," + a + ")");
        g.addColorStop(1, "rgba(" + rgb + ",0)");
        x.fillStyle = g;
        x.beginPath();
        x.arc(cx, cy, r, 0, 6.2832);
        x.fill();
      }
      (function buildEnv() {
        const c = mkCanvas(512, 256),
          x = c.getContext("2d");
        const g = x.createLinearGradient(0, 0, 0, 256);
        g.addColorStop(0, "#3a543f");
        g.addColorStop(0.55, "#1d2f22");
        g.addColorStop(1, "#0a120c");
        x.fillStyle = g;
        x.fillRect(0, 0, 512, 256);
        envBlob(x, 140, 66, 95, "255,255,255", 0.95); // key
        envBlob(x, 405, 84, 55, "158,215,150", 0.5); // leaf kicker
        envBlob(x, 256, 150, 120, "80,210,180", 0.3); // teal wash
        const tex = new THREE.CanvasTexture(c);
        tex.mapping = THREE.EquirectangularReflectionMapping;
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromEquirectangular(tex).texture;
        tex.dispose();
        pmrem.dispose();
      })();

      const hemi = new THREE.HemisphereLight(0x9fc8a8, 0x0c1022, 0.32);
      scene.add(hemi);
      const key = new THREE.DirectionalLight(0xfff8e8, 0.85);
      key.position.set(3.5, 5, 6);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.left = -4;
      key.shadow.camera.right = 4;
      key.shadow.camera.top = 4;
      key.shadow.camera.bottom = -4;
      key.shadow.camera.near = 1;
      key.shadow.camera.far = 20;
      key.shadow.bias = -0.0004;
      key.shadow.normalBias = 0.02;
      scene.add(key);
      const fill = new THREE.DirectionalLight(0x8fd8c8, 0.22);
      fill.position.set(-4, 1, 4);
      scene.add(fill);
      const rim = new THREE.DirectionalLight(0xa8d8a0, 0.35);
      rim.position.set(-2, 3, -5);
      scene.add(rim);

      /* everything book-related lives under one root so it can be fit-scaled */
      const bookRoot = new THREE.Group();
      scene.add(bookRoot);

      /* =========================================================================
   2. Shared procedural textures
   ========================================================================= */
      function tex(c) {
        const t = new THREE.CanvasTexture(c);
        t.encoding = THREE.sRGBEncoding;
        t.anisotropy = ANISO;
        return t;
      }

      function noiseTexture(base, amp, scratches) {
        const s = 256,
          c = mkCanvas(s, s),
          x = c.getContext("2d");
        const img = x.createImageData(s, s),
          d = img.data;
        for (let i = 0; i < d.length; i += 4) {
          const v = base + (Math.random() - 0.5) * 2 * amp;
          d[i] = d[i + 1] = d[i + 2] = v;
          d[i + 3] = 255;
        }
        x.putImageData(img, 0, 0);
        if (scratches) {
          x.strokeStyle = "rgba(200,200,200,.25)";
          x.lineWidth = 1;
          for (let i = 0; i < 5; i++) {
            x.beginPath();
            const y = Math.random() * s;
            x.moveTo(0, y);
            x.lineTo(s, y + (Math.random() - 0.5) * 22);
            x.stroke();
          }
        }
        return new THREE.CanvasTexture(c);
      }
      const laminateBump = noiseTexture(128, 10, true);
      const clothBump = (function () {
        const s = 128,
          c = mkCanvas(s, s),
          x = c.getContext("2d");
        x.fillStyle = "#808080";
        x.fillRect(0, 0, s, s);
        for (let i = 0; i < s; i += 2) {
          x.fillStyle =
            i % 4 === 0 ? "rgba(255,255,255,.22)" : "rgba(0,0,0,.22)";
          x.fillRect(i, 0, 1, s);
          x.fillRect(0, i, s, 1);
        }
        return new THREE.CanvasTexture(c);
      })();

      function striationTexture(vertical) {
        const s = 512,
          c = mkCanvas(s, s),
          x = c.getContext("2d");
        x.fillStyle = "#ece4d2";
        x.fillRect(0, 0, s, s);
        let p = 0;
        while (p < s) {
          const w = 1 + Math.random() * 2.4,
            tone = Math.random();
          x.fillStyle =
            tone < 0.12
              ? "rgba(140,125,95,.5)"
              : tone < 0.5
                ? "rgba(255,255,252,.55)"
                : "rgba(190,178,150,.45)";
          if (vertical) x.fillRect(p, 0, w, s);
          else x.fillRect(0, p, s, w);
          p += w + 0.6 + Math.random() * 1.6;
        }
        for (let i = 0; i < 2600; i++) {
          x.fillStyle =
            "rgba(120,108,84," + (Math.random() * 0.1).toFixed(3) + ")";
          x.fillRect(Math.random() * s, Math.random() * s, 1.2, 1.2);
        }
        return tex(c);
      }
      const striV = striationTexture(true); // fore edge (±x faces)
      const striH = striationTexture(false); // top and bottom (±y faces)

      const endpaperTex = (function () {
        const s = 512,
          c = mkCanvas(s, s),
          x = c.getContext("2d");
        x.fillStyle = "#f3edde";
        x.fillRect(0, 0, s, s);
        for (let i = 0; i < 1400; i++) {
          x.fillStyle =
            "rgba(120,105,70," + (0.04 + Math.random() * 0.08).toFixed(3) + ")";
          x.fillRect(Math.random() * s, Math.random() * s, 1.4, 1.4);
        }
        const g = x.createLinearGradient(0, 0, s, 0);
        g.addColorStop(0, "rgba(0,0,0,.07)");
        g.addColorStop(0.12, "rgba(0,0,0,0)");
        g.addColorStop(0.88, "rgba(0,0,0,0)");
        g.addColorStop(1, "rgba(0,0,0,.07)");
        x.fillStyle = g;
        x.fillRect(0, 0, s, s);
        return tex(c);
      })();

      const blobTex = (function () {
        const s = 256,
          c = mkCanvas(s, s),
          x = c.getContext("2d");
        const g = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
        g.addColorStop(0, "rgba(0,0,0,.85)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        x.fillStyle = g;
        x.fillRect(0, 0, s, s);
        return new THREE.CanvasTexture(c);
      })();

      /* =========================================================================
   3. Cover painters + book data
   ========================================================================= */
      function paintPriceAction(x, w, h) {
        const GREEN = "#37d67a",
          PAPER = "#f6f0e2",
          RED = "#ff5c6c";
        /* deep navy canvas with a faint trading grid */
        const g = x.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, "#1c2340");
        g.addColorStop(0.55, "#12172b");
        g.addColorStop(1, "#0a0d18");
        x.fillStyle = g;
        x.fillRect(0, 0, w, h);
        x.strokeStyle = "rgba(160,180,235,0.09)";
        x.lineWidth = 1;
        for (let i = 0; i <= 12; i++) {
          x.beginPath();
          x.moveTo(0, (i / 12) * h);
          x.lineTo(w, (i / 12) * h);
          x.stroke();
        }
        for (let i = 0; i <= 8; i++) {
          x.beginPath();
          x.moveTo((i / 8) * w, 0);
          x.lineTo((i / 8) * w, h);
          x.stroke();
        }

        /* volume bars under the chart */
        const N = 11,
          gap = 48,
          sx = 150,
          base = 1200;
        for (let i = 0; i < N; i++) {
          const cx = sx + i * gap;
          const vh = 40 + ((i * 61) % 180);
          x.fillStyle =
            i % 3 !== 0 ? "rgba(55,214,122,.22)" : "rgba(255,92,108,.22)";
          x.fillRect(cx - 15, base + 60 - vh, 30, vh);
        }

        /* candlestick chart climbing the cover */
        for (let i = 0; i < N; i++) {
          const cx = sx + i * gap;
          const up = i % 3 !== 0;
          const o = base - i * 44 + Math.sin(i * 1.7) * 14;
          const body = 26 + ((i * 37) % 34);
          const c = up ? o - body : o + body;
          x.strokeStyle = up ? GREEN : RED;
          x.fillStyle = up ? GREEN : RED;
          x.lineWidth = 5;
          x.beginPath();
          x.moveTo(cx, o - 30);
          x.lineTo(cx, c + 30);
          x.stroke();
          x.fillRect(cx - 14, Math.min(o, c), 28, Math.max(Math.abs(o - c), 5));

      const W = 1.42,

      const blockGeo = new THREE.BoxGeometry(W - 0.015, H, BLOCK_D);
      const pageGeo = new THREE.PlaneGeometry(PW, PH);

      const blobGeo = new THREE.PlaneGeometry(1, 1);

      function std(o) {
        return new THREE.MeshStandardMaterial(
          Object.assign({ metalness: 0.02 }, o),
        );
      }

      const paperFlat = std({
        color: 0xf2ecdd,
        roughness: 0.95,
        envMapIntensity: 0.2,
      });
      const striMatV = std({
        map: striV,
        bumpMap: striV,
        bumpScale: 0.0025,
        roughness: 0.95,
        envMapIntensity: 0.2,
      });
      const striMatH = std({
        map: striH,
        bumpMap: striH,
        bumpScale: 0.0025,
        roughness: 0.95,
        envMapIntensity: 0.2,
      });
      const endpaperMat = std({
        map: endpaperTex,
        roughness: 0.9,
        envMapIntensity: 0.25,
      });
      const pageMats = [0xf4eee0, 0xf1ebdb, 0xf6f0e3].map((c) =>
        std({
          color: c,
          roughness: 0.92,
          envMapIntensity: 0.22,
          side: THREE.DoubleSide,
