<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FTY USA v11 — All US Stocks EMA Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

/* ═══════════════════════ FTY · AWARD EDITION ═══════════════════════ */

:root,[data-theme="midnight"]{
--bg0:#04060c;--bg1:#070c16;
--panel:rgba(13,20,36,.62);--panel2:rgba(17,26,46,.88);
--line:rgba(148,163,184,.13);--line2:rgba(148,163,184,.26);
--txt:#eef3ff;--dim:#93a1bd;--faint:#5d6c8d;
--lime:#c9f24b;--lime-ink:#101a05;--lime-soft:color-mix(in srgb,var(--lime) 10%,transparent);
--up:#4ade80;--down:#f87171;--gold:#e8c064;--violet:#b9a8e0;--cyan:#7dd3fc;
--r:14px;
--fu:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--fm:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
--ease:cubic-bezier(.2,.8,.25,1);
--ease-out-strong:cubic-bezier(.23,1,.32,1);
}
[data-theme="arctic"]{
--bg0:#04070e;--bg1:#060c17;
--lime:#7dd3fc;--lime-ink:#06121f;
--cyan:#a5b4fc;
}
[data-theme="sunset"]{
--bg0:#0d0605;--bg1:#120a06;
--lime:#ff9e5e;--lime-ink:#200d03;
--cyan:#ffd166;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg0);color:var(--txt);font-family:var(--fu);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:color-mix(in srgb,var(--lime) 30%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.22);border-radius:99px;border:2px solid var(--bg0)}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--lime) 35%,transparent)}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,.srch:focus-visible{outline:2px solid color-mix(in srgb,var(--lime) 70%,transparent);outline-offset:2px}
a{color:var(--cyan)}

/* ── aurora background ── */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;background:
radial-gradient(1200px 600px at 15% -5%,color-mix(in srgb,var(--lime) 6%,transparent),transparent 60%),
radial-gradient(1000px 500px at 85% 0%,rgba(56,189,248,.06),transparent 60%),
radial-gradient(900px 700px at 50% 110%,rgba(168,85,247,.055),transparent 60%),var(--bg0)}
.aurora i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.55;animation:drift 26s ease-in-out infinite alternate}
.aurora .a1{width:440px;height:440px;left:-130px;top:-130px;background:color-mix(in srgb,var(--lime) 9%,transparent)}
.aurora .a2{width:540px;height:540px;right:-170px;top:-90px;background:rgba(56,189,248,.09);animation-delay:-8s}
.aurora .a3{width:480px;height:480px;left:35%;bottom:-230px;background:rgba(168,85,247,.09);animation-delay:-16s}
@keyframes drift{to{transform:translate(60px,42px) scale(1.08)}}

.wrap{max-width:1400px;margin:0 auto;padding:0 22px 70px}

/* ── pulse header ── */
.pulse{display:flex;align-items:stretch;gap:16px;padding:26px 2px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px;min-width:210px}
.brand-mark{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:25px;background:linear-gradient(140deg,var(--lime),color-mix(in srgb,var(--lime) 68%,#0c1403));box-shadow:0 6px 26px color-mix(in srgb,var(--lime) 35%,transparent);animation:markPulse 3.2s ease-in-out infinite}
@keyframes markPulse{50%{box-shadow:0 6px 38px color-mix(in srgb,var(--lime) 60%,transparent)}}
.brand-name{font-weight:700;font-size:22px;letter-spacing:.5px}
.brand-name em{font-style:normal;color:var(--lime)}
.brand-sub{font-size:10px;color:var(--faint);letter-spacing:2px;margin-top:3px}
.pulse-stats{flex:1;display:flex;gap:10px;min-width:300px}
.pstat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;overflow:hidden;min-width:104px;animation:cardIn .5s var(--ease) backwards}
.pstat:nth-child(2){animation-delay:.06s}.pstat:nth-child(3){animation-delay:.12s}.pstat:nth-child(4){animation-delay:.18s}.pstat:nth-child(5){animation-delay:.24s}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}}
.pstat::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lime);opacity:.85}
.pstat .num{font-family:var(--fm);font-size:25px;font-weight:700;line-height:1.15;white-space:nowrap}
.pstat .lbl{font-size:9.5px;letter-spacing:2px;color:var(--faint);margin-top:5px;font-weight:600}
.pstat.txt .num{font-size:14px;font-family:var(--fu);font-weight:700;white-space:normal;line-height:1.35}
.pstat.click{cursor:pointer;transition:transform .15s var(--ease)}
.pstat.click:active{transform:scale(.97)}
.pulse-side{display:flex;align-items:center;gap:10px;margin-left:auto}
.mkt{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:1.4px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:9px 15px;background:var(--panel)}
.mkt .dot{width:8px;height:8px;border-radius:50%;background:#64748b;flex-shrink:0}
.mkt.live{color:var(--up);border-color:rgba(74,222,128,.32)}
.mkt.live .dot{background:var(--up);box-shadow:0 0 12px var(--up);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.clock{font-family:var(--fm);font-size:12.5px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:9px 15px;background:var(--panel);white-space:nowrap}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:17px;cursor:pointer;transition:transform .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease)}
.icon-btn:hover{border-color:var(--lime);color:var(--lime);transform:translateY(-1px)}
.icon-btn.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}

/* ── command deck (sticky) ── */
.controls-bar{position:sticky;top:10px;z-index:50;background:rgba(6,9,17,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line2);border-radius:18px;padding:12px 16px 8px;margin:0 -4px 16px;box-shadow:0 14px 44px rgba(0,0,0,.5)}
.lv-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.lv-lbl{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--faint);width:88px;flex-shrink:0}
.lv-lbl.sub{width:auto;margin-left:10px}
.seg{display:flex;gap:5px;background:rgba(8,13,26,.75);border:1px solid var(--line);border-radius:13px;padding:4px}
.tf-card{background:none;border:none;border-radius:9px;color:var(--dim);font-size:12px;font-weight:700;padding:8px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .15s var(--ease-out-strong),background-color .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease)}
.tf-card .cnt{font-family:var(--fm);font-size:10px;background:rgba(148,163,184,.15);border-radius:6px;padding:2px 7px}
.tf-card:hover{color:var(--txt)}
.tf-card.on{background:var(--lime);color:var(--lime-ink);box-shadow:0 4px 16px color-mix(in srgb,var(--lime) 32%,transparent)}
.tf-card.on .cnt{background:rgba(0,0,0,.16)}
.ema-buttons{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;flex:1 1 220px;min-width:0;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.btn-ema{background:transparent;border:1px solid transparent;color:var(--dim);font-family:var(--fm);font-size:12px;font-weight:700;padding:8px 14px;border-radius:10px;cursor:pointer;transition:transform .15s var(--ease-out-strong),background-color .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease)}
.btn-ema:hover{color:var(--txt);border-color:var(--line2)}
.btn-ema.active{background:var(--lime-soft);border-color:color-mix(in srgb,var(--lime) 45%,transparent);color:var(--lime);box-shadow:0 0 18px color-mix(in srgb,var(--lime) 12%,transparent)}
/* v25: ~150 dynamic EMA pills live in ONE scrollable row — dashboard stays clean */
.ema-buttons::-webkit-scrollbar{height:6px}
.ema-buttons::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.ema-buttons::-webkit-scrollbar-track{background:transparent}
.btn-ema{flex:0 0 auto;white-space:nowrap;padding:6px 11px;font-size:11.5px}
.dropbar{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.drop-toggle{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(10,16,30,.85);border:1px solid var(--line);border-radius:12px;padding:9px 15px;color:var(--dim);font-size:12px;font-weight:700;cursor:pointer;transition:border-color .16s var(--ease),color .16s var(--ease);white-space:nowrap;overflow:hidden;min-width:0}
.drop-toggle:hover{border-color:color-mix(in srgb,var(--lime) 40%,transparent);color:var(--txt)}
.drop-toggle b{color:var(--txt);letter-spacing:2px;font-size:10.5px}
.drop-sum{color:var(--lime);font-weight:600;margin-left:8px;font-size:11px;overflow:hidden;text-overflow:ellipsis}
.drop-chev{display:inline-block;transition:transform .22s var(--ease);color:var(--lime);font-size:13px;flex-shrink:0}
.drop-toggle.open .drop-chev{transform:rotate(180deg)}
.btn-scan{background:linear-gradient(135deg,var(--lime),#9ede2b);color:var(--lime-ink);border:none;border-radius:12px;padding:13px 28px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:9px;box-shadow:0 6px 22px color-mix(in srgb,var(--lime) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s var(--ease-out-strong),box-shadow .18s var(--ease);position:relative;overflow:hidden}
.scan-ico{transform:translateY(1px)}
.btn-scan:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 30px color-mix(in srgb,var(--lime) 45%,transparent)}
.btn-scan:disabled{opacity:.55;cursor:wait}
.srch{background:rgba(8,13,26,.85);border:1px solid var(--line);color:var(--txt);padding:10px 14px;border-radius:12px;font-size:12.5px;flex:0 1 210px;min-width:140px;transition:border-color .16s}
.srch:focus{outline:none;border-color:color-mix(in srgb,var(--lime) 50%,transparent)}
#filterPanel{overflow:hidden;max-height:0;opacity:0;transition:max-height .34s var(--ease),opacity .26s}
#filterPanel.open{max-height:560px;opacity:1}
.ex-seg{display:flex;gap:5px;background:rgba(8,13,26,.75);border:1px solid var(--line);border-radius:13px;padding:4px}
.ex-seg button{background:none;border:none;border-radius:9px;color:var(--dim);font-size:12px;font-weight:700;padding:8px 16px;cursor:pointer;transition:transform .15s var(--ease-out-strong),background-color .15s var(--ease),color .15s var(--ease),box-shadow .15s var(--ease)}
.ex-seg button.active{background:rgba(125,211,252,.16);color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(125,211,252,.3)}
.fchip{background:rgba(12,19,35,.85);border:1px solid var(--line);border-radius:99px;padding:9px 17px;font-size:12px;font-weight:700;color:var(--dim);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .15s var(--ease-out-strong),border-color .15s var(--ease),color .15s var(--ease),background-color .15s var(--ease),box-shadow .15s var(--ease);white-space:nowrap}
.fchip:hover{color:var(--txt);border-color:var(--line2);transform:translateY(-1px)}
.fchip.on{border-color:color-mix(in srgb,var(--lime) 50%,transparent);color:var(--lime);background:var(--lime-soft);box-shadow:0 0 16px color-mix(in srgb,var(--lime) 12%,transparent)}

.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sec-head h2{font-size:11px;letter-spacing:2.5px;color:var(--faint);margin:0;font-weight:700}
.sec-head h2 b{color:var(--lime)}
.sec-hint{font-size:11px;color:var(--faint)}
.sec-head .fchip{margin-left:auto}

/* ── result sections & table ── */
.dash-sec{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:cardIn .45s var(--ease) backwards}
.res-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.res-title{font-size:15px;font-weight:700;letter-spacing:.3px}
.res-title small{color:var(--faint);font-weight:500;font-size:12px}
/* Index watchlist: scanned-but-not-qualified constituents render dimmed */
tr.idx-extra{opacity:.55}
tr.idx-extra:hover{opacity:.85}
.sig.nosetup{background:rgba(148,163,184,.12);color:#94a3b8;border:1px solid rgba(148,163,184,.25);font-size:10px;padding:3px 8px;border-radius:20px;white-space:nowrap}
.res-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-acc{background:var(--lime);color:var(--lime-ink);border:none;border-radius:11px;padding:11px 20px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 18px color-mix(in srgb,var(--lime) 28%,transparent);transition:transform .15s var(--ease-out-strong),box-shadow .16s var(--ease)}
.btn-acc:hover{transform:translateY(-1px);box-shadow:0 8px 26px color-mix(in srgb,var(--lime) 42%,transparent)}
.btn-ghost{background:transparent;border:1px solid var(--line2);color:var(--dim);border-radius:11px;padding:11px 18px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .15s var(--ease-out-strong),border-color .16s var(--ease),color .16s var(--ease)}
.btn-ghost:hover{color:var(--txt);border-color:var(--dim);transform:translateY(-1px)}
.btn-ghost.btn-xs{padding:4px 10px;font-size:11px;border-radius:8px;letter-spacing:.4px;white-space:nowrap}
.btn-ghost.danger:hover{color:var(--down);border-color:rgba(248,113,113,.5)}
.mini-dist{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--faint);margin:2px 0 10px}
.mini-dist .dots{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.mini-dist b{color:var(--dim);font-family:var(--fm)}
.tbl-scroll{overflow:auto;max-height:580px;border:1px solid var(--line);border-radius:13px}
.rtbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:880px}
.rtbl thead th{position:sticky;top:0;text-align:left;font-size:9.5px;letter-spacing:1.8px;color:var(--faint);font-weight:700;padding:11px 13px;border-bottom:1px solid var(--line2);background:rgba(7,11,21,.94);cursor:pointer;white-space:nowrap;z-index:2;transition:color .12s}
.rtbl thead th:hover{color:var(--lime)}
.rtbl td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
.rtbl tbody tr{transition:background .12s;cursor:pointer}
.rtbl tbody tr:hover{background:color-mix(in srgb,var(--lime) 5%,transparent)}
.rtbl tbody tr:last-child td{border-bottom:none}
.c-rank{font-family:var(--fm);color:var(--faint);font-size:11px}
.c-sym{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.c-sym a{color:var(--txt);text-decoration:none;transition:color .12s}
.c-sym a:hover{color:var(--lime)}
.c-name{font-size:11px;color:var(--faint);margin-top:3px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-tag{font-size:9px;font-weight:700;letter-spacing:1.2px;border-radius:6px;padding:3px 8px}
.ex-tag.nasdaq{background:rgba(125,211,252,.13);color:var(--cyan)}
.ex-tag.nyse{background:rgba(232,192,100,.13);color:var(--gold)}
.mono{font-family:var(--fm)}
.dim{color:var(--dim)}
.score-cell{display:flex;align-items:center;gap:9px}
.score-bar{width:62px;height:6px;border-radius:99px;background:rgba(148,163,184,.16);overflow:hidden;flex-shrink:0}
.score-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--lime),color-mix(in srgb,var(--lime) 68%,#0c1403))}
.grade{font-size:9px;font-weight:700;letter-spacing:1px;border-radius:6px;padding:3px 8px;white-space:nowrap}
.grade.perfect{background:rgba(232,192,100,.15);color:var(--gold)}
.grade.strong{background:rgba(185,168,224,.14);color:var(--violet)}
.grade.good{background:rgba(125,211,252,.12);color:var(--cyan)}
.grade.moderate{background:rgba(148,163,184,.12);color:var(--dim)}
.grade.weak{background:rgba(248,113,113,.1);color:var(--down)}
.nb-pill{font-size:10px;font-weight:700;letter-spacing:1.2px;border-radius:99px;padding:5px 12px;white-space:nowrap}
.nb-pill.yes{background:rgba(74,222,128,.13);color:var(--up);border:1px solid rgba(74,222,128,.32)}
.nb-pill.no{background:rgba(148,163,184,.08);color:var(--faint);border:1px solid var(--line)}
.setup-cell{display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:240px}
.pat{font-size:10px;font-weight:700;border-radius:7px;padding:3px 9px;letter-spacing:.3px;white-space:nowrap}
.pat.near{background:rgba(125,211,252,.12);color:var(--cyan)}
.pat.hammer{background:rgba(232,192,100,.13);color:var(--gold)}
.pat.pinbar{background:rgba(185,168,224,.13);color:var(--violet)}
.pat.bullish{background:rgba(74,222,128,.13);color:var(--up)}
.setup-txt{font-size:11.5px;color:var(--dim)}
.fresh-tag{font-size:13px}
.sig{font-size:10px;font-weight:700;letter-spacing:1.1px;border-radius:8px;padding:6px 12px;white-space:nowrap}
.sig.sb{background:color-mix(in srgb,var(--lime) 13%,transparent);color:var(--lime);border:1px solid color-mix(in srgb,var(--lime) 38%,transparent)}
.sig.b{background:rgba(74,222,128,.11);color:var(--up);border:1px solid rgba(74,222,128,.3)}
.sig.w{background:rgba(232,192,100,.11);color:var(--gold);border:1px solid rgba(232,192,100,.3)}
.sig.n{background:rgba(148,163,184,.08);color:var(--faint);border:1px solid var(--line)}
.dash-mut{color:var(--faint);font-size:12.5px;line-height:1.7}
.last-upd{font-size:11px;color:var(--faint);margin:2px 2px 12px;font-family:var(--fm)}
.count{font-size:11.5px;color:var(--faint);margin:10px 2px;font-family:var(--fm)}

/* top cards */
.top5-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:transform .15s var(--ease-out-strong),border-color .15s var(--ease),background-color .15s var(--ease);background:rgba(8,13,26,.4);animation:cardIn .38s var(--ease) backwards}
.top5-row:hover{border-color:color-mix(in srgb,var(--lime) 35%,transparent);transform:translateX(3px);background:color-mix(in srgb,var(--lime) 4%,transparent)}
.top5-row:last-child{margin-bottom:0}
.top5-rank{font-family:var(--fm);font-size:12px;color:var(--lime);font-weight:700;width:30px}
.top5-sym{font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.top5-score{font-family:var(--fm);font-weight:700;font-size:13px}
.top5-dist{font-family:var(--fm);font-size:11.5px;width:70px;text-align:right}

/* grouped view */

/* empty state */
.empty{text-align:center;padding:72px 24px;border:1px dashed var(--line2);border-radius:20px;background:var(--panel);backdrop-filter:blur(10px)}
.empty-art{font-size:54px;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-9px)}}
.empty-title{font-size:19px;font-weight:700;margin:16px 0 8px}
.empty-sub{color:var(--dim);font-size:13.5px;line-height:1.8}
.empty-sub b{color:var(--lime)}

/* skeleton shimmer */
.skel{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.skel-row{height:54px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(100deg,rgba(148,163,184,.05) 40%,rgba(148,163,184,.15) 50%,rgba(148,163,184,.05) 60%);background-size:200% 100%;animation:shimmer 1.35s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* scan status (bottom) */

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(3,5,10,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;place-items:center;z-index:100;padding:20px}

.modal-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
#copyText{width:100%;min-height:130px;background:rgba(8,13,26,.8);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-family:var(--fm);font-size:12px;padding:12px;resize:vertical}

/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,16px);background:rgba(13,20,36,.96);border:1px solid color-mix(in srgb,var(--lime) 40%,transparent);color:var(--txt);padding:12px 24px;border-radius:13px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease);z-index:200;box-shadow:0 12px 40px rgba(0,0,0,.5);max-width:90vw}

body.focus-mode .sec-top,body.focus-mode .sec-fresh{display:none}

#boot{position:fixed;inset:0;z-index:9999;background:var(--bg0);display:flex;align-items:center;justify-content:center;transition:opacity .5s ease,visibility .5s;animation:bootHide .6s ease 2.6s forwards}

// AUTO-DETECT: NO fixed EMA list. Coarse-to-fine search finds the integer P the
// stock follows most cleanly on this timeframe — any value (28, 69, 101...),
// decided by the scan, not by a preset grid.
// Clean support only: every close in the respect window held above it.
// Ties broken by nearer price, then nearer EMA.
function autoCandidateScore(closes,STF,P,lastClose){
if(closes.length<P+10)return null;
let emaS=computeEMASeries(closes,P),ema=emaS[emaS.length-1];
if(!(lastClose>ema))return null;
let distPct=+(((lastClose-ema)/ema)*100).toFixed(2);
let respectStart=cleanRespectStart(closes.length,P,STF),respectBars=closes.length-respectStart,breaks=0;
for(let i=respectStart;i<closes.length;i++)if(closes[i]<emaS[i])breaks++;
if(breaks>0)return null;
let supportPct=Math.round(100*(respectBars-breaks)/respectBars);
let score=Math.round(Math.max(40,Math.min(90,45+supportPct*.4+Math.min(12,((closes.length-P)/52)*12)-Math.min(15,distPct))));
return {P:P,ema:ema,distPct:distPct,supportPct:supportPct,score:score,respectBars:respectBars};
}
function autoBetter(c,best){
return !best||c.score>best.score||(c.score===best.score&&(c.distPct<best.distPct||(c.distPct===best.distPct&&c.P<best.P)));
}
function pickAutoEMA(closes,STF){
let lastClose=closes[closes.length-1],best=null;
// coarse pass: every 10 — finds the neighbourhood
for(let P=10;P<=250;P+=10){
let c=autoCandidateScore(closes,STF,P,lastClose);
if(c&&autoBetter(c,best))best=c;
}
if(!best)return null;
// refine pass: +-9 around the coarse winner — exact integer, scan-decided
let lo=Math.max(10,best.P-9),hi=best.P+9; // floor 10: search range, not a fixed value — any integer 10..250
for(let P=lo;P<=hi;P++){
if(P%10===0)continue;
let c=autoCandidateScore(closes,STF,P,lastClose);
if(c&&autoBetter(c,best))best=c;
}
return best;
}

function drawStockChart(cv,ts,q,P,showLegend=true){
let closes=q.close.map(c=>c==null?null:c);
let valid=closes.map((c,i)=>({c,i})).filter(o=>o.c!=null);
if(valid.length<P+5)return false;
let emaS=computeEMASeries(valid.map(o=>o.c),P);
let all=valid.map((o,k)=>({ts:ts[o.i],c:o.c,l:q.low[o.i],h:q.high[o.i],e:emaS[k]}));
let N=Math.min(120,all.length);
let view=all.slice(-N);
let lo=Math.min.apply(null,view.map(v=>Math.min(v.l,v.e)))*0.995;
let hi=Math.max.apply(null,view.map(v=>Math.max(v.h,v.e)))*1.005;
let ctx=cv.getContext('2d');let W=cv.width,H=cv.height,pad=8;
let X=i=>pad+(W-2*pad)*i/(N-1), Y=v=>pad+(H-2*pad)*(1-(v-lo)/(hi-lo));
ctx.clearRect(0,0,W,H);
// EMA line (gold)
ctx.strokeStyle='#e8c064';ctx.lineWidth=1.6;ctx.beginPath();
view.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v.e)):ctx.moveTo(X(i),Y(v.e)));ctx.stroke();
// Candles
view.forEach((v,i)=>{
let up=v.c>=v.c0||v.c>=(v.cPrev==null?v.c:v.cPrev);
ctx.strokeStyle=up?'#5fd6a2':'#f87171';ctx.fillStyle=up?'#5fd6a2':'#f87171';ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(X(i),Y(v.h));ctx.lineTo(X(i),Y(v.l));ctx.stroke();
let bw=Math.max(1.5,(W-2*pad)/N*0.55);
let top=Y(Math.max(v.c,(v.cPrev==null?v.c:v.cPrev))),bot=Y(Math.min(v.c,(v.cPrev==null?v.c:v.cPrev)));
ctx.fillRect(X(i)-bw/2,top,bw,Math.max(1,bot-top));
});
// EMA test / rejection markers (last 60 bars)
let s2=Math.max(0,N-60);
for(let i=s2;i<N;i++){
let e=view[i].e,l=view[i].l,c=view[i].c;
if(l<=e*1.02){
let rej=c>e;
ctx.fillStyle=rej?'#5fd6a2':'#f87171';
ctx.beginPath();ctx.arc(X(i),Y(l)+6,3,0,7);ctx.fill();
}}
if(showLegend){ctx.fillStyle='#64748f';ctx.font='10px Segoe UI';
ctx.fillText(TF_META[TF].lbl+' · '+P+' EMA line (gold) · dots = EMA tests (green = held, red = broke)',pad,H-4);}
return true;
}

// ═══ FTY FOLLOWER ENGINE ═══
// EMA series aligned 1:1 with closes (seeded from first close)
function computeEMASeries(closes,P){
let k=2/(P+1),out=[],e=closes[0];
for(let i=0;i<closes.length;i++){e=i?closes[i]*k+e*(1-k):closes[0];out.push(e);}
return out;
}
// Scan the active trend regime, not the stock's whole listing history.
// The windows remain strict: every close in the selected window must hold above EMA.
// They are shorter on higher timeframes because each bar represents more time.
function cleanRespectStart(n,P,t){
let windows={
 D:{201:100,101:75,51:55,21:40,11:28},
 W:{201:60,101:45,51:32,21:24,11:16},
 M:{201:30,101:24,51:18,21:12,11:8}
};
let bars=(windows[t]||windows.W)[P]||P;
return Math.max(P-1,n-bars);
}
// CANDLE-PATTERN SETUP DETECTION — candle-level rules, identical on Weekly/Daily/Monthly.
// Returns array of {type,label,detail} like the original scanner: near / hammer / pinbar / bullish.
function detectPatterns(closes,lows,highs,emaS,P){
let n=closes.length;if(!n)return[];
let ema=emaS[n-1];let pats=[];
// Near EMA ≤2% (same rule as the original 201-EMA scanner)
let dist=Math.abs(closes[n-1]-ema)/ema*100;
if(dist<=2)pats.push({type:'near',label:'Near (2%)',detail:'Price within 2% of '+P+' EMA'});
// Look at the last 4 candles — recent setup counts (Hammer/PinBar often fire on a prev bar)
let s0=Math.max(1,n-4);
for(let i=s0;i<n;i++){
let c=closes[i],prev=closes[i-1],l=lows[i],h=highs[i],be=emaS[i];   // be = THIS bar's EMA
if(c==null||prev==null||l==null||h==null||be==null)continue;
let rng=h-l;if(rng<=0)continue;
let body=Math.abs(c-prev);
let lower=c>=prev?c-l:l-c;          // lower wick: from body edge
let upper=h-(c>=prev?c:prev);
// Big-bar timeframes (W/D/M): a bar OPENS at the prior close — so if the prior
// close sat near the level, THIS bar genuinely traded from the level. Classic
// "Hammer (prev)" style detection from the original 201-EMA scanner.
let openedNear=prev<=be*1.04;                       // prior close within 4% of the level
let touched=l<=be*1.04;                             // wick reached the level this bar
let interact=openedNear||touched;
if(!interact)continue;
// HAMMER: lower wick >= 2x body, small upper wick
if(lower>=2*body&&upper<=0.35*rng){
pats.push({type:'hammer',label:i===n-1?'Hammer':'Hammer (prev)',detail:'Long lower wick rejection from '+P+' level'});}
// PIN BAR (bullish): long LOWER wick ≥ 60% of range, small upper wick, close holds above the level
if(lower>=0.6*rng&&lower>=3*upper&&c>be){
pats.push({type:'pinbar',label:i===n-1?'Pin Bar':'Pin Bar (prev)',detail:'Bullish pin bar at '+P+' support'});}
// BULLISH candle: solid green candle off the level
if(c>prev&&body>=0.5*rng&&body<=2.5*rng){
pats.push({type:'bullish',label:i===n-1?'Bullish':'Bullish (prev)',labelPrev:true,detail:'Strong bullish candle near '+P+' level'});}
}
// dedupe by type, keep most recent first
let seen={};return pats.filter(p=>seen[p.type]?false:(seen[p.type]=true));
}
// CLEAN FOLLOWER ANALYSIS for one stock on one EMA.
// Qualify: price ABOVE EMA + clean support regime. For 21/11, the supplied
// chart style is assessed over the latest 60/40 bars; longer EMAs stay lifetime-strict.
// (close<ema counts as a break; a wick below the EMA does NOT).
// Score: exactly 100 points across 8 components, clamped 0..100.
function analyzeFollower(closes,lows,highs,P,t){
if(!t)t=TF;
let n=closes.length;
if(n<P+10)return null;                     // insufficient history → UNKNOWN, never fake
let emaS=computeEMASeries(closes,P);
let last=closes[n-1],ema=emaS[n-1];
if(!(last>ema))return null;                 // must be above
let distPct=(last-ema)/ema*100;
// Daily 21/11 also admits high-respect trends (up to 30% closes below support);
// zero-break followers retain the perfect flag and rank above every other result.
let respectStart=cleanRespectStart(n,P,t);
let respectBars=n-respectStart,breaks=0;
for(let i=respectStart;i<n;i++)if(closes[i]<emaS[i])breaks++;
let neverBroke=breaks===0,isDailyShort=t==='D'&&(P===21||P===11);
if(!neverBroke&&(!isDailyShort||breaks/respectBars>0.30))return null;
let look=Math.min(60,n-P);                  // interaction window
let s0=n-look;
// 1. Support respect 20 — zero breaks earns the full score.
let pRespect=Math.round(20*(respectBars-breaks)/respectBars);
// 2+3. Interactions 15 / Rejections 15 — pullbacks toward the EMA that held.
// A "test" = low reaches within 2% of the EMA (exact touch not required).
let tests=0,rejections=0,failed=0,lastRejIdx=-1;
// Adaptive proximity: tight followers get flagged at 1.5%, wide ones at 4%
let testBand=Math.min(4,Math.max(1.5,distPct*0.8));
for(let i=s0;i<n;i++){
if(lows[i]<=emaS[i]*(1+testBand/100)){
tests++;
if(closes[i]>emaS[i]){rejections++;lastRejIdx=i;}else failed++;
}
}
let pInteract=Math.round(15*Math.min(1,tests/4));
let pReject=Math.round(15*Math.min(1,rejections/3));
// 4. Proximity 10 — close is good, extended is penalized
let pProx=distPct<=1.5?10:distPct<=3?7:distPct<=5?4:Math.max(0,6-distPct*0.15);
pProx=Math.round(Math.max(0,Math.min(10,pProx)));
// 5. Slope 10 — EMA direction vs 10 bars ago
let ref=Math.max(0,n-11);let slopePct=(emaS[n-1]-emaS[ref])/emaS[ref]*100;
let slope=slopePct>2?'Strong Rising':slopePct>0.3?'Rising':slopePct>-0.3?'Flat':'Falling';
let pSlope=slope==='Strong Rising'?10:slope==='Rising'?7:slope==='Flat'?4:0;
// 6. Structure 10 — higher highs + higher lows in the window
let hh=0,hl=0;for(let i=s0+1;i<n;i++){if(highs[i]>highs[i-1])hh++;if(lows[i]>lows[i-1])hl++;}
let pStruct=Math.round(10*Math.min(1,(hh+hl)/(2*(look-1))*1.6));
// 7. Continuation 10 — price extended after the most recent rejection
let pCont=0;
if(lastRejIdx>=0){let gain=(last-closes[lastRejIdx])/closes[lastRejIdx]*100;pCont=gain>2?10:gain>0.5?6:last>closes[lastRejIdx]?3:0;}else pCont=distPct<=5?5:0;
// 8. Failed-test control 10 — clean followers have zero breaks
let pFail=tests?Math.round(10*(1-failed/tests)):10;
if(!neverBroke)pFail=Math.min(pFail,Math.round(10*(1-breaks/respectBars)));
let score=Math.max(0,Math.min(100,pRespect+pInteract+pReject+pProx+pSlope+pStruct+pCont+pFail));
let grade=neverBroke&&score>=90?'PERFECT':score>=80?'STRONG':score>=70?'GOOD':score>=60?'MODERATE':'WEAK';
// Fresh setup detection (recent window per timeframe)
let win=t==='D'?15:t==='W'?8:4;
let w0=n-win;let setup='';
let nearLast=false;for(let i=Math.max(s0,w0);i<n;i++)if(lows[i]<=emaS[i]*(1+testBand/100))nearLast=true;
let consTight=true;for(let i=n-5;i<n;i++)if(Math.abs(closes[i]-emaS[i])/emaS[i]>0.03)consTight=false;
if(nearLast&&last>closes[n-2])setup='EMA Rejection';
else if(nearLast)setup='EMA Retest';
else if(consTight)setup='Consolidation Near EMA';
else if(last>=Math.max.apply(null,closes.slice(-20)))setup='Bullish Continuation';
else if(distPct<=2)setup='EMA Support';
let fresh=!!setup&&lastRejIdx>=w0||(!!setup&&setup!=='');
fresh=!!setup;
let signal='NO SIGNAL';
if(neverBroke&&score>=90&&fresh&&(slope==='Strong Rising'||slope==='Rising'))signal='STRONG BUY';
else if(score>=80&&fresh)signal='BUY';
else if(score>=70)signal='WATCH';
let pats=detectPatterns(closes,lows,highs,emaS,P);
let breakdown=[
{lbl:'Historical Respect',got:pRespect,max:20},
{lbl:'Interactions',got:pInteract,max:15},
{lbl:'Rejections',got:pReject,max:15},
{lbl:'Proximity',got:pProx,max:10},
{lbl:'EMA Slope',got:pSlope,max:10},
{lbl:'Price Structure',got:pStruct,max:10},
{lbl:'Continuation',got:pCont,max:10},
{lbl:'Failure Control',got:pFail,max:10}
];
return {last:last,ema:Math.round(ema*100)/100,distPct:+distPct.toFixed(2),neverBroke:neverBroke,respectBars:respectBars,breaks:breaks,score:score,grade:grade,tests:tests,rejections:rejections,failed:failed,slope:slope,setup:setup,fresh:fresh,signal:signal,breakdown:breakdown,emaS:emaS,patterns:pats};
}

for(let STF of TFS){

// PRIMARY conditions — price above EMA + clean support regime — are
// closes-only checks, so the SAME closes qualify the stock on all 5 levels ×
// all 3 timeframes (Daily/Weekly/Monthly) in one go. AUTO + all 5 fixed EMAs
// are evaluated per stock in the same pass (CPU-only; no extra network).
// Stage 2 later enriches

let C=q[0].close||[];

let lastClose=closes[closes.length-1];

let ex=src.ex||'NYSE';
for(let _L of [AUTO_KEY].concat(EMA_PERIODS)){
if(_L===AUTO_KEY){
// ── AUTO-DETECT: exactly ONE row per stock — the cleanest EMA it follows ──

if(!best){idxTrack(sym,STF,ex,src,lastClose,AUTO_KEY,null,'no clean EMA');continue;}
let P=best.P,ema=best.ema,distPct=best.distPct,supportPct=best.supportPct,score=best.score,respectBars=best.respectBars;
let bucket=liveData[STF];if(!bucket[AUTO_KEY])bucket[AUTO_KEY]=[];

bucket[AUTO_KEY].push({symbol:sym,name:(src.name||sym),ex:ex,sector:(src.sector||''),price:lastClose,ema:ema,distPct:distPct,neverBroke:true,respectBars:respectBars,breaks:0,patterns:[],streak:0,score:score,signal:score>=80?'STRONG BUY':score>=70?'BUY':'WATCH',grade:score>=90?'PERFECT FOLLOWER':score>=80?'STRONG FOLLOWER':score>=70?'GOOD FOLLOWER':score>=60?'MODERATE':'WEAK',tests:0,rejections:0,slope:'—',setup:'',fresh:false,breakdown:null,reasons:['Following '+P+' EMA · 100% support respect over '+respectBars+' bars','Provisional score — OHLC enrichment adds patterns/tests','Trading '+distPct+'% above auto-detected '+P+' EMA'],weekDate:new Date().toISOString().split('T')[0],hasSignal:true,respect:score,lvl:P,lvlTF:STF,needsOHLC:true});
idxTrack(sym,STF,ex,src,lastClose,AUTO_KEY,distPct,'qualified');
foundBy[AUTO_KEY]=(foundBy[AUTO_KEY]||0)+1;
foundBy[ex]=(foundBy[ex]||0)+1;
if(STF===TF){let chipHost=$('scanResults');chipHost.insertAdjacentHTML('beforeend',`<div class="scan-result-chip" onclick="copySymbol('${sym}')"><span class="chip-sym">${sym}</span> <span class="chip-dist">${P} EMA · +${distPct}%</span></div>`);}
continue;
}
let P=_L;
if(closes.length<P+10){idxTrack(sym,STF,ex,src,lastClose,P,null,'short history');continue;} // insufficient history → skip
let emaS=computeEMASeries(closes,P);
let ema=emaS[emaS.length-1];
let distPct=+(((lastClose-ema)/ema)*100).toFixed(2);
if(!(lastClose>ema)){idxTrack(sym,STF,ex,src,lastClose,P,distPct,'below EMA');continue;} // must be above
let respectStart=cleanRespectStart(closes.length,P,STF),respectBars=closes.length-respectStart,breaks=0;
for(let i=respectStart;i<closes.length;i++)if(closes[i]<emaS[i])breaks++;
let neverBroke=breaks===0,isDailyShort=STF==='D'&&(P===21||P===11);

if(!neverBroke&&(!isDailyShort||breaks/respectBars>0.30)){idxTrack(sym,STF,ex,src,lastClose,P,distPct,'broke support');continue;}

if(bucket[P].find(r=>r.symbol===sym))continue;
// Provisional score (0-100, clamped); Stage-2 OHLC replaces it with the
// full 8-component follower score.
let supportPct=Math.round(100*(respectBars-breaks)/respectBars);
let score=Math.round(Math.max(40,Math.min(90,45+supportPct*.4+Math.min(12,((closes.length-P)/52)*12)-Math.min(15,distPct))));
bucket[P].push({symbol:sym,name:(src.name||sym),ex:ex,sector:(src.sector||''),price:lastClose,ema:ema,distPct:distPct,neverBroke:neverBroke,respectBars:respectBars,breaks:breaks,patterns:[],streak:0,score:score,signal:neverBroke&&score>=80?'STRONG BUY':score>=70?'BUY':'WATCH',grade:neverBroke&&score>=90?'PERFECT FOLLOWER':score>=80?'STRONG FOLLOWER':score>=70?'GOOD FOLLOWER':score>=60?'MODERATE':'WEAK',tests:0,rejections:0,slope:'—',setup:'',fresh:false,breakdown:null,reasons:['Above '+P+' EMA · '+supportPct+'% support respect over '+respectBars+' bars','Provisional score — OHLC enrichment adds patterns/tests','Trading '+distPct+'% above '+P+' EMA'],weekDate:new Date().toISOString().split('T')[0],hasSignal:true,respect:score,lvl:P,lvlTF:STF,needsOHLC:true});
idxTrack(sym,STF,ex,src,lastClose,P,distPct,'qualified');

foundBy[ex]=(foundBy[ex]||0)+1;

}else{retryQ.push(batch);

await new Promise(r=>setTimeout(r,2000+Math.random()*2000));
}

}
}
let bw=[];for(let i=0;i<Math.min(CONC,Math.ceil(total/BS));i++){bw.push(batchWorker());await new Promise(r=>setTimeout(r,150));}
await Promise.allSettled(bw);

// One targeted retry sweep for failed batches with fresh routing (proxies warm
// up at different times) — rescues them without rescanning the whole universe
if(retryQ.length){
// Multi-round rescue: proxies recover at different times, so wait between
// rounds. A shrinking retryQ = progress; two flat rounds = give up.
let rounds=[15000,25000,35000,45000];
for(let ri=0;ri<rounds.length&&retryQ.length;ri++){

let failedBatches=retryQ;retryQ=[];

// Qualified rows (top OHLC_CAP per level, provisional score order) get a real

// 8-component score, Hammer/PinBar/Bullish/Near patterns, tests/rejections,
// slope and fresh setup. Session cache (window._ohlcMem) keys by TF too.
const OHLC_CAP=120;
for(let t of TFS){for(let P of autoLevelKeys()){
let arr=liveData[t][P];if(!arr||!arr.length)continue;
arr.sort((a,b)=>(b.score||0)-(a.score||0));
arr.forEach((r,i)=>{if(r.needsOHLC)r.needsOHLC=(i<OHLC_CAP);});

$('scanProgress').style.width='100%';
// Rank every bucket: STRONG BUY first, then fresh setups, then follower score.
// MTF PRIORITY: stocks strong on MORE timeframes float to the top (small boost

for(let t of TFS){for(let P of autoLevelKeys()){

function computeEMAJS(closes,period){
let k=2/(period+1);
let ema=closes[0];
for(let i=1;i<closes.length;i++)ema=closes[i]*k+ema*(1-k);
return Math.round(ema*100)/100;
}

let cv=document.getElementById('cardsView');
let btn=document.getElementById('viewToggle');
if(btn)btn.innerHTML=cardsView?'\uD83D\uDCCB Table':'\uD83C\uDCCF Cards';
if(cv)cv.hidden=!cardsView;
document.querySelectorAll('#content .tbl-scroll').forEach(t=>{t.style.display=cardsView?'none':'';});
}
function palCommands(){
return [
{t:'\uD83D\uDD2C Scan Market',h:'run scan',fn:()=>liveScan()},
{t:'\uD83C\uDCCF Toggle Cards / Table',h:'switch view',fn:()=>toggleCardsView()},
{t:'\uD83C\uDFAF Focus mode',h:'dim UI',fn:()=>toggleFocus()},
{t:'\uD83D\uDCCB Copy next 30',h:'clipboard',fn:()=>copyNext30()},
{t:'\u2193 Export CSV',h:'download',fn:()=>exportCSV()},
{t:'\uD83C\uDFA8 Theme \u00B7 Midnight Lime',h:'theme',fn:()=>applyTheme('midnight')},
{t:'\uD83C\uDFA8 Theme \u00B7 Arctic Ice',h:'theme',fn:()=>applyTheme('arctic')},
{t:'\uD83C\uDFA8 Theme \u00B7 Sunset Copper',h:'theme',fn:()=>applyTheme('sunset')}
];
}
function openPal(){
let p=document.getElementById('pal');if(!p)return;
p.hidden=false;palRender('');
let inp=document.getElementById('palInput');
setTimeout(()=>{if(inp)inp.focus();},40);
}
function closePal(){let p=document.getElementById('pal');if(p)p.hidden=true;}
function palRender(q){
q=(q||'').trim().toUpperCase();
let cmds=palCommands().filter(c=>!q||c.t.toUpperCase().indexOf(q)>=0);
let syms=(__ftyRows||[]).filter(r=>!q||String(r.symbol).toUpperCase().indexOf(q)>=0).slice(0,8);
let list=document.getElementById('palList');if(!list)return;
let h=cmds.map((c,i)=>'<div class="pal-item" data-cmd="'+i+'" tabindex="0"><span>'+c.t+'</span><kbd>'+c.h+'</kbd></div>').join('')
+syms.map(r=>'<div class="pal-item sym" data-sym="'+r.symbol+'" data-ex="'+r.ex+'" tabindex="0"><span>\uD83D\uDCC8 '+r.symbol+'<em>'+r.ex+' \u00B7 '+(r.name||'')+'</em></span><kbd>'+(r.score||0)+'</kbd></div>').join('');
list.innerHTML=h||'<div class="pal-empty">No matches — try a symbol or "theme"</div>';
list.querySelectorAll('.pal-item').forEach(el=>{
el.addEventListener('click',()=>palActivate(el));
el.addEventListener('keydown',ev=>{if(ev.key==='Enter')palActivate(el);});
});
}
function palActivate(el){
let cmd=el.getAttribute('data-cmd'),sym=el.getAttribute('data-sym');
closePal();
if(cmd!==null&&cmd!==''){let c=palCommands()[+cmd];if(c&&c.fn)c.fn();}
else if(sym){stockRowClick(sym,el.getAttribute('data-ex'));}
}
function directorInit(){
initTheme();bootSeq();
try{cardsView=localStorage.getItem('ftyCardsView')==='1';}catch(e){}
applyCardsView();
let inp=document.getElementById('palInput');
if(inp){
inp.addEventListener('input',e=>palRender(e.target.value));
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){let f=document.querySelector('#palList .pal-item');if(f)f.click();e.stopPropagation();}});
}
let pal=document.getElementById('pal');
if(pal)pal.addEventListener('click',e=>{if(e.target===pal)closePal();});
document.addEventListener('keydown',e=>{
let k=e.key||'';
if((e.metaKey||e.ctrlKey)&&k.toLowerCase()==='k'){e.preventDefault();openPal();}
else if(k==='Escape'){let p=document.getElementById('pal');if(p&&!p.hidden)closePal();}
});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',directorInit);
else directorInit();

</script>
</body>
</html>
